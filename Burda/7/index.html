<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Практическое занятие №7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <section>
        <div class="task-container">
            <input type="text" placeholder="Плейсхолдер">
            <input type="text" value="Value">
            <input type="text" value="disabled" disabled class="bg-disabled">
            <input type="password" value="123456">
            <textarea placeholder="Введите текст"></textarea>
            <input type="button" value="Кнопка через тег input">
            <button type="button">Кнопка через тег button</button>
        </div>
    </section>

    <section>
        <div class="task-container">
            <div class="label-row">
                <input type="text" placeholder="Плейсхолдер" id="inp1">
                <label for="inp1">Это метка для инпута - нажмите на меня - и инпут получит фокус!</label>
            </div>
            <button type="submit">Отправить на сервер</button>
        </div>
    </section>

    <section>
        <div class="task-container">
            <p>
                <input type="checkbox" id="c1">
                <label for="c1" class="red-border">Это метка для чекбокса: нажмите на меня - чекбокс сменит галочку!</label>
            </p>
            <p>
                <input type="checkbox" id="c2" checked>
                <label for="c2" class="red-border">Я отмечен по умолчанию!</label>
            </p>
            <p>
                <input type="checkbox" id="c3" checked disabled>
                <label for="c3" class="red-border">Я disabled!</label>
            </p>

            <div class="radio-group-box">
                <p>Это группа радиокнопок - только одна из них может быть отмечена!</p>
                <input type="radio" name="r_group" id="r1"> <label for="r1" class="red-border">Это метка для радио</label><br><br>
                <input type="radio" name="r_group" id="r2"> <label for="r2" class="red-border">Это метка для радио</label>
            </div>
            <button type="submit">Отправить на сервер</button>
        </div>
    </section>

    <section>
        <div class="task-container flex-row">
            <select>
                <option>Нью Йорк</option>
                <option>Москва</option>
                <option>Киев</option>
            </select>

            <select size="3" multiple>
                <option>Москва</option>
                <option>Киев</option>
                <option selected>Нью Йорк</option>
            </select>

            <select size="5" multiple>
                <option>Минск</option>
                <option>Москва</option>
                <option>Киев</option>
                <option selected>Нью Йорк</option>
                <option>Варшава</option>
            </select>
            <button type="submit">Отправить на сервер</button>
        </div>

        <div class="task-container">
            <input type="file" class="inline-file">
            <button type="submit">Отправить на сервер</button>
        </div>
    </section>

    <section>

        <div class="task-container">
            <fieldset>
                <legend>Выберите кнопочку</legend>
                <input type="radio" name="f1"> <input type="radio" name="f1"> <input type="radio" name="f1">
                <input type="text" placeholder="Ваше имя..." class="inline-text">
            </fieldset>

            <fieldset>
                <legend>Выберите еще кнопочку</legend>
                <input type="radio" name="f2"> <input type="radio" name="f2"> <input type="radio" name="f2"> <input type="radio" name="f2"> <input type="radio" name="f2">
            </fieldset>
            <button type="submit" class="mt-15">Отправить на сервер</button>
        </div>
    </section>

    <section>
        <div class="task-container">
            <textarea class="res-limit" placeholder="Ограничена ширина и высота"></textarea>
            <textarea class="res-none" placeholder=""></textarea>
            <textarea class="res-vert" placeholder=""></textarea>
            <textarea class="res-hor" placeholder=""></textarea>
        </div>
    </section>

</body>
</html>
